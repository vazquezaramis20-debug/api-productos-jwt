<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - API Productos JWT</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    button.secondary { background: #28a745; }
    button.logout { background: #dc3545; }
    #mensaje { margin-top: 10px; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="auth-section" class="card">
    <h2>Iniciar Sesión / Registro</h2>
    <input type="text" id="username" placeholder="Usuario" required>
    <input type="password" id="password" placeholder="Contraseña (mínimo 6 caracteres)" required>
    <button onclick="login()">Iniciar Sesión</button>
    <button class="secondary" onclick="registrar()">Registrarse</button>
    <p id="mensaje"></p>
  </div>

  <div id="panel-section" class="card hidden">
    <h2>Panel de Productos (Ruta Protegida)</h2>
    <p>Sesión activa con JWT.</p>
    <button onclick="cargarProductos()">Consultar Productos</button>
    <button class="logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    <pre id="resultado-productos"></pre>
  </div>

  <script>
    const mensaje = document.getElementById('mensaje');
    const authSection = document.getElementById('auth-section');
    const panelSection = document.getElementById('panel-section');
    const resultado = document.getElementById('resultado-productos');

    function actualizarUI() {
      const token = localStorage.getItem('token');
      if (token) {
        authSection.classList.add('hidden');
        panelSection.classList.remove('hidden');
      } else {
        authSection.classList.remove('hidden');
        panelSection.classList.add('hidden');
      }
    }

    async function registrar() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      mensaje.textContent = data.message || JSON.stringify(data.errors);
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (res.ok && data.token) {
        localStorage.setItem('token', data.token);
        mensaje.textContent = '';
        actualizarUI();
      } else {
        mensaje.textContent = data.message || 'Error al iniciar sesión.';
      }
    }

    async function cargarProductos() {
      const token = localStorage.getItem('token');
      const res = await fetch('/api/productos', {
        method: 'GET',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      resultado.textContent = JSON.stringify(data, null, 2);
    }

    function cerrarSesion() {
      localStorage.removeItem('token');
      resultado.textContent = '';
      actualizarUI();
    }

    actualizarUI();
  </script>
</body>
</html>
